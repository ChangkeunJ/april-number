name: ci
on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/cache@v4
        with:
          path: data
          key: privatehealth-${{ hashFiles('src/fetch.mjs') }}
      - run: npm run fetch
      - run: npm run check
      - run: npm run build
      - run: npm test
      - run: node src/smoke.mjs
